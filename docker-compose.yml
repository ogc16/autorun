services:
  autorun:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autorun
    ports:
      - "8080:8080"
    volumes:
      - autorun-data:/app/data
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - AUTORUN_PYTHON_INTERPRETER=python3
    restart: unless-stopped

volumes:
  autorun-data:
