services:
  db:
    image: mysql:8.0
    container_name: autorun-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autorun
      MYSQL_USER: autorun
      MYSQL_PASSWORD: autorun
    ports:
      - "3306:3306"
    volumes:
      - autorun-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: autorun-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      AUTORUN_DB_HOST: db
      AUTORUN_DB_PORT: "3306"
      AUTORUN_DB_NAME: autorun
      AUTORUN_DB_USER: autorun
      AUTORUN_DB_PASSWORD: autorun
      AUTORUN_JWT_SECRET: local-dev-secret-key-that-is-long-enough-for-hmac-256!!
    ports:
      - "8080:8080"

volumes:
  autorun-mysql-data:
