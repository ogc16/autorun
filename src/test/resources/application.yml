spring:
  datasource:
    url: jdbc:h2:mem:autorun-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  mail:
    host: localhost
  h2:
    console:
      enabled: false

autorun:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hmac-256-32bytes!!
    access-token-ttl: 3600
    refresh-token-ttl: 86400
  storage-dir: ${java.io.tmpdir}/autorun-tests/scripts
  log-dir: ${java.io.tmpdir}/autorun-tests/logs
  python-interpreter: python
  max-concurrent-executions: 5
  default-timeout-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
