<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · AutoRun'">AutoRun</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>

<body th:fragment="body">
<div class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
                <i class="bi bi-terminal-fill me-1"></i>AutoRun
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/scripts}"><i class="bi bi-file-earmark-code me-1"></i>Scripts</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/workflows}"><i class="bi bi-diagram-3 me-1"></i>Workflows</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/approvals}"><i class="bi bi-check2-circle me-1"></i>Approvals</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/policies}"><i class="bi bi-shield-lock me-1"></i>Policies</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/jobs}"><i class="bi bi-calendar-event me-1"></i>Scheduler</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/executions}"><i class="bi bi-list-check me-1"></i>Executions</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/audit}"><i class="bi bi-shield-check me-1"></i>Audit</a></li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/settings}"><i class="bi bi-bell me-1"></i>Alerts</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge text-bg-info me-2"
                          th:text="'Role: ' + ${#authentication.getAuthorities()}">ROLE</span>
                    <span class="text-light small me-3"
                          th:text="${#authentication.getName()}">user</span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button class="btn btn-sm btn-outline-light" type="submit">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 py-4">
        <div class="container-fluid px-4">

            <div th:if="${flashSuccess}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${flashSuccess}">ok</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${flashError}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${flashError}">err</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <th:block th:insert="~{::content}"></th:block>
        </div>
    </main>

    <footer class="py-3 border-top bg-dark text-white-50">
        <div class="container-fluid px-4 small">
            <i class="bi bi-terminal me-1"></i>AutoRun · Automation Script Runner · Spring Boot + Quartz
        </div>
    </footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
