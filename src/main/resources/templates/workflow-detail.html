<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Workflow Detail')}"></head>
<body th:replace="~{fragments :: body}">
<div th:fragment="content">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/workflows}">Workflows</a></li>
            <li class="breadcrumb-item active" th:text="${workflow.name}">Name</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1" th:text="${workflow.name}">Workflow</h1>
            <p class="text-muted mb-0" th:text="${workflow.description}">Description</p>
        </div>
        <div class="d-flex gap-2 align-items-center">
            <span class="badge" th:classappend="${workflow.enabled} ? 'text-bg-success' : 'text-bg-secondary'"
                  th:text="${workflow.enabled} ? 'Enabled' : 'Disabled'">Status</span>
            <button class="btn btn-success" th:if="${workflow.enabled}"
                    th:onclick="'runWorkflow(' + ${workflow.id} + ')'">
                <i class="bi bi-play-fill"></i> Run Workflow
            </button>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-8">
            <div class="stat-card p-3">
                <h2 class="h6 fw-bold mb-3">Steps (<span th:text="${#lists.size(steps)}">0</span>)</h2>
                <div class="list-group list-group-flush">
                    <div class="list-group-item px-0" th:each="step, iter : ${steps}">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="badge text-bg-dark me-2" th:text="${iter.index + 1}">1</span>
                                <strong th:text="${step.name}">Step</strong>
                                <span class="text-muted ms-2 small" th:text="'Script #' + ${step.scriptId}">Script</span>
                            </div>
                            <div>
                                <span class="badge text-bg-light border me-1" th:if="${step.condition}"
                                      th:text="'if: ' + ${step.condition}">condition</span>
                                <span class="badge"
                                      th:classappend="${step.onError.name() == 'STOP'} ? 'text-bg-danger' : (${step.onError.name() == 'CONTINUE'} ? 'text-bg-info' : 'text-bg-warning')"
                                      th:text="${step.onError}">onError</span>
                            </div>
                        </div>
                    </div>
                    <div class="list-group-item text-center text-muted small py-3" th:if="${#lists.isEmpty(steps)}">
                        No steps defined
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="stat-card p-3">
                <h2 class="h6 fw-bold mb-3">Info</h2>
                <table class="table table-sm mb-0">
                    <tr><td class="text-muted small">Created by</td><td class="small" th:text="${workflow.createdBy?.username}">-</td></tr>
                    <tr><td class="text-muted small">Created</td><td class="small" th:text="${#temporals.format(workflow.createdAt, 'MMM dd, yyyy')}">-</td></tr>
                    <tr><td class="text-muted small">Last run</td>
                        <td class="small" th:text="${workflow.lastRunAt != null ? #temporals.format(workflow.lastRunAt, 'MMM dd HH:mm') : 'never'}">never</td></tr>
                    <tr><td class="text-muted small">Tags</td>
                        <td><span th:each="tag : ${workflow.tags?.split(',')}" class="badge text-bg-light border me-1"
                                  th:text="${#strings.trim(tag)}">tag</span></td></tr>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:fragment="scripts">
<script>
function runWorkflow(id) {
    fetch('/api/workflows/' + id + '/run', {method:'POST'})
        .then(r => r.json())
        .then(d => alert('Workflow run started!'))
        .catch(() => alert('Error'));
}
</script>
</div>
</body>
</html>
