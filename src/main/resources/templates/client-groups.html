<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Client Groups')}"></head>
<body th:replace="~{fragments :: body}">
<div th:fragment="content">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/policies}">Policies</a></li>
            <li class="breadcrumb-item active">Client Groups</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Client Groups</h1>
            <p class="text-muted mb-0">Organize clients into groups for policy-based automation</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createGroupModal">
            <i class="bi bi-plus-lg"></i> New Group
        </button>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="stat-card p-3 d-flex align-items-center">
                <div class="stat-icon bg-primary-subtle text-primary me-3"><i class="bi bi-people"></i></div>
                <div>
                    <div class="text-muted small">Total Groups</div>
                    <div class="fs-4 fw-bold" th:text="${#lists.size(clientGroups)}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card p-3 d-flex align-items-center">
                <div class="stat-icon bg-success-subtle text-success me-3"><i class="bi bi-check-circle"></i></div>
                <div>
                    <div class="text-muted small">Active</div>
                    <div class="fs-4 fw-bold" th:text="${#lists.size(clientGroups)}">0</div>
                </div>
            </div>
        </div>
    </div>

    <div class="stat-card p-3">
        <div th:if="${#lists.isEmpty(clientGroups)}" class="text-muted small py-3">
            No client groups yet. Create groups to scope policies to specific client sets.
        </div>
        <table th:if="${!#lists.isEmpty(clientGroups)}" class="table table-hover align-middle mb-0">
            <thead>
            <tr class="text-muted small">
                <th>Name</th><th>Description</th><th>Tags</th><th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cg : ${clientGroups}">
                <td class="fw-semibold" th:text="${cg.name}">Group</td>
                <td class="text-muted small" th:text="${cg.description}">Description</td>
                <td>
                    <span th:each="tag : ${cg.tags?.split(',')}" class="badge text-bg-light border me-1"
                          th:text="${#strings.trim(tag)}">tag</span>
                </td>
                <td>
                    <span class="badge" th:classappend="${cg.enabled} ? 'text-bg-success' : 'text-bg-secondary'"
                          th:text="${cg.enabled} ? 'Active' : 'Disabled'">Status</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="createGroupModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">New Client Group</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createGroupForm">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Name</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Description</label>
                            <textarea class="form-control" name="description" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Tags (comma-separated)</label>
                            <input type="text" class="form-control" name="tags" placeholder="e.g. enterprise,production">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitGroup()">Create</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:fragment="scripts">
<script>
function submitGroup() {
    const form = document.getElementById('createGroupForm');
    fetch('/api/client-groups', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name: form.name.value, description: form.description.value, tags: form.tags.value})
    }).then(r => { if (r.ok) location.reload(); else alert('Error'); });
}
</script>
</div>
</body>
</html>
