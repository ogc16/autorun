<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Policy Detail')}"></head>
<body th:replace="~{fragments :: body}">
<div th:fragment="content">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/policies}">Policies</a></li>
            <li class="breadcrumb-item active" th:text="${policy.name}">Name</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1" th:text="${policy.name}">Policy</h1>
            <p class="text-muted mb-0" th:text="${policy.description}">Description</p>
        </div>
        <span class="badge" th:classappend="${policy.enabled} ? 'text-bg-success' : 'text-bg-secondary'"
              th:text="${policy.enabled} ? 'Active' : 'Disabled'">Status</span>
    </div>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="stat-card p-3">
                <h2 class="h6 fw-bold mb-3">Configuration</h2>
                <table class="table table-sm mb-0">
                    <tr><td class="text-muted small" style="width:40%">Script</td>
                        <td class="small" th:text="${policy.script?.name}">-</td></tr>
                    <tr><td class="text-muted small">Client Group</td>
                        <td class="small" th:text="${policy.clientGroup?.name ?: 'All Clients'}">All</td></tr>
                    <tr><td class="text-muted small">Schedule</td>
                        <td><code class="small" th:text="${policy.cronExpression}">0 * * * *</code></td></tr>
                    <tr><td class="text-muted small">Timezone</td>
                        <td class="small" th:text="${policy.timeZone}">UTC</td></tr>
                    <tr><td class="text-muted small">Notify on</td>
                        <td class="small" th:text="${policy.notifyOn}">FAILURE</td></tr>
                    <tr><td class="text-muted small">Arguments</td>
                        <td><code class="small" th:text="${policy.argumentsJson}">{}</code></td></tr>
                    <tr><td class="text-muted small">Created by</td>
                        <td class="small" th:text="${policy.createdBy?.username}">-</td></tr>
                    <tr><td class="text-muted small">Created</td>
                        <td class="small" th:text="${#temporals.format(policy.createdAt, 'MMM dd, yyyy')}">-</td></tr>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:fragment="scripts">
<script>
function deletePolicy(id) {
    if (!confirm('Delete this policy?')) return;
    fetch('/api/policies/' + id, {method:'DELETE'})
        .then(r => { if (r.ok) window.location.href='/policies'; else alert('Error'); });
}
</script>
</div>
</body>
</html>
