<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Policy Detail')}"></head>
<body th:replace="~{fragments :: body}">
<div th:fragment="content">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/policies}">Policies</a></li>
            <li class="breadcrumb-item active" th:text="${policy.name}">Name</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1" th:text="${policy.name}">Policy</h2>
            <p class="text-muted mb-0" th:text="${policy.description}">Description</p>
        </div>
        <span class="badge fs-6" th:classappend="${policy.enabled} ? 'bg-success' : 'bg-secondary'"
              th:text="${policy.enabled} ? 'Active' : 'Disabled'">Status</span>
    </div>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card bg-dark border-secondary">
                <div class="card-header border-secondary fw-bold">
                    <i class="bi bi-gear me-1"></i> Configuration
                </div>
                <div class="card-body">
                    <table class="table table-sm table-dark mb-0">
                        <tr><td class="text-muted" style="width:40%">Script</td>
                            <td th:text="${policy.script?.name}">-</td></tr>
                        <tr><td class="text-muted">Client Group</td>
                            <td th:text="${policy.clientGroup?.name ?: 'All Clients'}">All</td></tr>
                        <tr><td class="text-muted">Schedule</td>
                            <td><code th:text="${policy.cronExpression}">0 * * * *</code></td></tr>
                        <tr><td class="text-muted">Timezone</td>
                            <td th:text="${policy.timeZone}">UTC</td></tr>
                        <tr><td class="text-muted">Notify on</td>
                            <td th:text="${policy.notifyOn}">FAILURE</td></tr>
                        <tr><td class="text-muted">Arguments</td>
                            <td><code class="small" th:text="${policy.argumentsJson}">{}</code></td></tr>
                        <tr><td class="text-muted">Created by</td>
                            <td th:text="${policy.createdBy?.username}">-</td></tr>
                        <tr><td class="text-muted">Created</td>
                            <td th:text="${#temporals.format(policy.createdAt, 'MMM dd, yyyy')}">-</td></tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
