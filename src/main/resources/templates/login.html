<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login')}"></head>
<body class="bg-dark">
<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-lg" style="width: 22rem;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-terminal-fill text-primary" style="font-size: 2.5rem;"></i>
                <h1 class="h4 mt-2 mb-0 fw-bold">AutoRun</h1>
                <p class="text-muted small mb-0">Automation Script Runner</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger py-2 small">
                Invalid username or password
            </div>
            <div th:if="${param.logout}" class="alert alert-info py-2 small">
                You have been logged out
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="admin" autofocus required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>

            <div class="mt-3 small text-muted text-center">
                Demo accounts: <code>admin / admin123</code> · <code>tech / tech123</code>
            </div>
        </div>
    </div>
</div>
</body>
</html>
