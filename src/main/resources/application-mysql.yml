spring:
  datasource:
    url: jdbc:mysql://${AUTORUN_DB_HOST:localhost}:${AUTORUN_DB_PORT:3306}/${AUTORUN_DB_NAME:autorun}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${AUTORUN_DB_USER:autorun}
    password: ${AUTORUN_DB_PASSWORD:autorun}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  h2:
    console:
      enabled: false
